name: klt signoff

# Re-render the tier verdict from the committed block manifest
# (manifests/sg13g2-pa.json) and byte-compare it against the committed
# verdict of record (manifests/sg13g2-pa.signoff.json). A manifest, vendored
# checklist or klt-pin change without a regenerated record fails here.
# Also runs the unit tests and re-attests T1 item 10 (attest/item10.json ->
# evidence/item10.json): the envelope hashes README.md and the other hygiene
# files byte-for-byte, so editing them without regenerating it fails here.
# See manifests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt and the unit-test dependencies
        run: pip install klayout-tools==0.8.0 numpy pytest

      - name: Unit tests (sim/lib, no simulator needed)
        run: python3 -m pytest -q sim/lib

      - name: Re-attest T1 item 10 against the committed envelope
        run: klt signoff --attest 10 --inventory attest/item10.json --check evidence/item10.json

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/sg13g2-pa.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # 0 = every T1 item met; 3 = grader ran clean, at least one item
          # unmet. Both are valid runs. Anything else is a hard error.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sg13g2-pa.signoff.json; then
            echo "::error::Fresh klt signoff output differs from manifests/sg13g2-pa.signoff.json - the committed verdict is stale."
            echo "Regenerate and commit the record in this same PR (see manifests/README.md)."
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sg13g2-pa.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh."
