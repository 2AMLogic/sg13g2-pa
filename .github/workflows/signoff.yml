name: klt signoff

# The gate is scripts/check-ci.sh, not this file. It holds the check list and
# the klt pin once; `npm run check:ci` runs the same script, so the local gate
# and CI cannot check different things. What each check is, and which T1 items
# are deliberately not re-attested here, is documented at the top of that
# script; how to regenerate each envelope and the record is in
# manifests/README.md.
#
# The one thing this file still states for itself is the installed klt
# version below. It is not a second pin: the script refuses to run unless
# `klt --version` equals its own KLT_PIN, so a bump that edits only one of
# the two fails here rather than silently grading the evidence with the
# wrong release.
#
# scripts/check-ci.sh needs a `python3` that has numpy and pytest, because
# the item-10 inventory's `unit-tests` check runs the host interpreter. The
# install step below puts klt, numpy and pytest in the same interpreter,
# which is why the step passes KLT=klt instead of letting the script build a
# throwaway uvx environment.
#
# Editing THIS FILE drifts evidence/item10.json, whose envelope hashes it
# byte-for-byte; regenerate the envelope and then the signoff record in the
# same change or the item-10 check below fails.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt and the unit-test dependencies
        run: pip install klayout-tools==0.9.1 numpy pytest

      - name: Run the gate (scripts/check-ci.sh)
        run: KLT=klt scripts/check-ci.sh
